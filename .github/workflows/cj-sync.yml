# Free scheduled sync (GitHub Actions, 2,000 minutes/month on the free tier).
# Add CJ_ACCESS_TOKEN under Settings → Secrets and variables → Actions → New repository secret.
name: CJ Affiliate sync

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours, offset to avoid the top of the hour
  workflow_dispatch:            # lets you trigger a run by hand

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to commit the refreshed data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch CJ links and merge
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_PUBLISHER_ID: 8058000
          CJ_PROPERTY_ID: 101873115
        run: |
          # exit 2 means "connected, no links" — keep the previous data
          set +e
          node scripts/fetch-cj.js --json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then echo "No links returned; nothing to commit."; exit 0; fi
          exit $code

      - name: Validate before committing
        run: |
          node scripts/validate.js --strict
          node scripts/predeploy.js | tail -2

      - name: Commit refreshed data
        run: |
          git config user.name  "nipcoupon-bot"
          git config user.email "bot@nipcoupon.local"
          git add data/ backups/ || true
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "chore(data): sync CJ affiliate offers [skip ci]"
          git push
