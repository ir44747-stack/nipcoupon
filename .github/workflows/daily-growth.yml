name: Daily Growth

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not commit changes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-growth:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run growth script
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY }}
          SOVRN_SECRET_KEY: ${{ secrets.SOVRN_SECRET_KEY }}
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "auth: using secrets.GH_PAT"
          else
            echo "auth: using default GITHUB_TOKEN"
          fi
          npm run growth
