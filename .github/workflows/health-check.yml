name: Health check

# The supervisor routine. An AI agent cannot run on a timer — it executes only
# when invoked and keeps no process between turns — so the recurring monitoring
# lives here, where GitHub's scheduler runs it whether or not anyone is present.
#
# Every 6 hours rather than hourly, deliberately:
#   * the catalogue only changes when daily-growth (00:00) or sync-coupons
#     (02:00) runs, so hourly checks would re-verify an unchanged repo 22 times
#     a day and burn Actions minutes for no signal;
#   * a run that fails at 03:00 and again at 04:00 is not new information, it is
#     the same incident notified twice.
# Raise the frequency if the catalogue ever starts updating intra-day.

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'data/**'
      - 'locales/**'
      - 'index.html'
      - 'vercel.json'
      - 'robots.txt'

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile install needed: the health check uses only Node built-ins,
      # exactly like the rest of scripts/. Keeps the job under a minute.
      - name: Run health check
        id: health
        env:
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY }}
          SITE_URL: https://nipcoupon.vercel.app
        run: |
          set -o pipefail
          node scripts/health-check.js --live 2>&1 | tee /tmp/health.txt


      # Content differentiation. Not a gate — a low score is a signal to add
      # real store facts, not a reason to fail the build. Runs here so the
      # number is tracked over time in the job log rather than measured once.
      - name: Store page content quality
        if: always()
        env:
          SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY }}
        run: node scripts/content-quality.js || true

      # Only reached when the step above exits non-zero. Opens one issue per
      # incident and reuses it while the failure persists, so a broken deploy
      # does not generate an issue every six hours.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('/tmp/health.txt', 'utf8'); } catch (e) { body = 'No output captured.'; }
            const title = 'Health check failing';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check'
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comment = `Run: ${runUrl}\n\n\`\`\`\n${body.slice(0, 60000)}\n\`\`\``;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body: comment
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['health-check'], body: comment
              });
            }

      # Close the incident automatically once the checks pass again.
      - name: Resolve open incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check'
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Health check passing again — closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
            }
